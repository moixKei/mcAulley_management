<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Horarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --success-color: #4cc9f0;
            --warning-color: #f72585;
            --info-color: #4895ef;
        }
        
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            max-width: 1400px;
        }
        
        /* Header Styles */
        .d-flex.justify-content-between.align-items-center.mb-4 {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(67, 97, 238, 0.3);
        }
        
        .d-flex.justify-content-between.align-items-center.mb-4 h1 {
            font-weight: 700;
            margin-bottom: 0;
            font-size: 2.2rem;
        }
        
        /* Button Styles */
        .btn-success {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(107, 114, 128, 0.4);
        }
        
        /* Alert Styles */
        .alert {
            border: none;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .alert-success {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        
        .alert-danger {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        
        /* Card Styles */
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .card-header {
            border-radius: 15px 15px 0 0 !important;
            padding: 1.25rem 1.5rem;
            font-weight: 600;
        }
        
        .bg-primary.text-white {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%) !important;
        }
        
        .bg-info.text-white {
            background: linear-gradient(135deg, var(--info-color) 0%, #2563eb 100%) !important;
        }
        
        /* Table Styles */
        .table {
            margin: 0;
        }
        
        .table thead th {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        
        .table tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #f1f3f4;
        }
        
        .table tbody tr:hover {
            background-color: #f8f9fa;
            transform: scale(1.01);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .table tbody td {
            padding: 1.25rem 1.5rem;
            vertical-align: middle;
            border: none;
        }
        
        /* Badge Styles */
        .badge {
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            font-size: 0.75rem;
        }
        
        .badge.bg-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%) !important;
        }
        
        .badge.bg-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
        }
        
        .badge.bg-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
        }
        
        .badge.bg-light {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%) !important;
        }
        
        /* Button Group Styles */
        .btn-group-sm > .btn {
            border-radius: 8px;
            margin: 0 2px;
            padding: 0.5rem 0.75rem;
            transition: all 0.3s ease;
        }
        
        .btn-info {
            background: linear-gradient(135deg, var(--info-color) 0%, #2563eb 100%);
            color: white;
            border: none;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
        }
        
        .btn-info:hover, .btn-danger:hover {
            transform: translateY(-2px) scale(1.05);
        }
        
        /* Empty State */
        .text-center.py-4 {
            padding: 4rem 2rem !important;
        }
        
        .text-center.py-4 i {
            font-size: 4rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-clock me-2"></i>Gestión de Horarios</h1>
            <a th:href="@{/horarios/nuevo}" class="btn btn-success">
                <i class="fas fa-plus me-1"></i>Nuevo Horario
            </a>
        </div>

        <!-- Alertas -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Información del Curso (si se está filtrando por curso) -->
        <div th:if="${curso != null}" class="card mb-4">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0">
                    <i class="fas fa-book me-1"></i>
                    Horarios del Curso: <span th:text="${curso.nombre}"></span>
                </h5>
            </div>
        </div>

        <!-- Tabla de Horarios -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="fas fa-list me-1"></i>
                    Lista de Horarios
                    <span th:if="${curso != null}" class="badge bg-light text-dark ms-2">
                        Curso: <span th:text="${curso.nombre}"></span>
                    </span>
                </h5>
            </div>
            <div class="card-body">
                <div th:if="${horarios.empty}" class="text-center py-4">
                    <i class="fas fa-calendar-times fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">No se encontraron horarios</h5>
                    <p th:if="${curso != null}" class="text-muted">
                        No hay horarios registrados para este curso
                    </p>
                    <a th:href="@{/horarios/nuevo}" class="btn btn-primary mt-2">
                        <i class="fas fa-plus me-1"></i>Crear Primer Horario
                    </a>
                </div>

                <div th:unless="${horarios.empty}" class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Curso</th>
                                <th>Día</th>
                                <th>Hora Inicio</th>
                                <th>Hora Fin</th>
                                <th>Aula</th>
                                <th>Activo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="horario : ${horarios}">
                                <td th:text="${horario.idHorario}"></td>
                                <td>
                                    <strong th:text="${horario.curso.nombre}"></strong>
                                    <br>
                                    <small class="text-muted">
                                        ID: <span th:text="${horario.curso.idCurso}"></span>
                                    </small>
                                </td>
                                <td>
                                    <span class="badge bg-primary" th:text="${horario.diaSemana}"></span>
                                </td>
                                <td>
                                    <span class="badge bg-success" th:text="${#temporals.format(horario.horaInicio, 'HH:mm')}"></span>
                                </td>
                                <td>
                                    <span class="badge bg-danger" th:text="${#temporals.format(horario.horaFin, 'HH:mm')}"></span>
                                </td>
                                <td th:text="${horario.aula} ?: 'Sin asignar'"></td>
                                <td>
                                    <span th:if="${horario.activo}" class="badge bg-success">
                                        <i class="fas fa-check"></i> Sí
                                    </span>
                                    <span th:unless="${horario.activo}" class="badge bg-danger">
                                        <i class="fas fa-times"></i> No
                                    </span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/horarios/curso/{id}(id=${horario.curso.idCurso})}" 
                                           class="btn btn-info" title="Ver horarios del curso">
                                            <i class="fas fa-list"></i>
                                        </a>
                                        <form th:action="@{/horarios/eliminar/{id}(id=${horario.idHorario})}" 
                                              method="post" class="d-inline"
                                              th:onsubmit="return confirm('¿Está seguro de eliminar este horario?');">
                                            <button type="submit" class="btn btn-danger" title="Eliminar">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Navegación -->
        <div class="mt-4">
            <a th:href="@{/cursos}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-1"></i>Volver a Cursos
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-dismiss alerts after 5 seconds
        setTimeout(function() {
            var alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                var bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            });
        }, 5000);

        // Tooltip initialization
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[title]'));
        var tooltipList = tooltipTriggerList.map(function(tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    </script>
</body>
</html>
